# Fork (Thomas): every night, take the latest release of the original app
# (udhaykumarbala/cleanyourtv-app) and the latest launcher release of the fork (Eliotm2/cleanyourtv,
# made half an hour earlier by its thomas-launcher.yml from the original launcher), merge and bundle
# them into `thomas` with our additions, number the app after its launcher (<launcher>-thomas.N), run
# the tests, build the APK signed with the fork's key and publish it as a release of this repository.
# The app's "Check for updates" reads those releases. When the merge needs a person, nothing is
# pushed and an issue says why.
#
# Secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_B64         the keystore (accueil.jks), base64
#   KEYSTORE_PROPERTIES  storePassword, keyAlias, keyPassword (storeFile is set here)
name: Thomas · reprise de l'original

on:
  schedule:
    - cron: "37 1 * * *"   # 01:37 UTC, 02:37 or 03:37 in France
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: thomas-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: thomas
          fetch-depth: 0
          submodules: true

      - name: Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"

      - name: Merge the latest upstream release
        id: sync
        run: |
          set +e
          .github/thomas/sync.sh
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ $code -eq 0 ] || [ $code -eq 2 ]

      - name: Submodule at the merged commit
        if: steps.sync.outputs.new == 'true'
        run: git submodule update --init --depth 1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.sync.outputs.new == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Signing key
        if: steps.sync.outputs.new == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PROPERTIES" ] || { echo "::error::secrets KEYSTORE_B64 and KEYSTORE_PROPERTIES are missing"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/thomas.jks"
          { printf '%s\n' "$KEYSTORE_PROPERTIES" | grep -v '^storeFile='; echo "storeFile=$RUNNER_TEMP/thomas.jks"; } > keystore.properties

      - name: Tests and signed APK
        if: steps.sync.outputs.new == 'true'
        run: ./gradlew --no-daemon --continue test :app:assembleFullRelease

      - name: The APK carries the fork's key
        if: steps.sync.outputs.new == 'true'
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/full/release/*.apk | head -1)
          signer=$("$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          [ "$signer" = fa73a3a033c6bb075706307ff446928530b90305a198b4349b02c4ce1eae29d5 ] || { echo "::error::APK signed by $signer"; exit 1; }
          name="cleanyourtv-thomas-${{ steps.sync.outputs.version }}.apk"
          cp "$apk" "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"

      - name: Commit, push and publish
        if: steps.sync.outputs.new == 'true'
        env:
          VERSION: ${{ steps.sync.outputs.version }}
          NOTES: ${{ steps.sync.outputs.notes }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          rm -f keystore.properties
          git commit -q -m "Fork Thomas $VERSION : reprise automatique ($NOTES)"
          git push origin HEAD:thomas
          gh release create "$VERSION" "$APK" --target "$(git rev-parse HEAD)" --title "$VERSION" \
            --notes "Reprise automatique ($NOTES) avec les ajouts de Thomas. Signée avec la clé du fork : elle s'installe par-dessus la version précédente."

      - name: Say why it stopped
        if: always() && (steps.sync.outputs.code == '2' || failure())
        env:
          TAG: ${{ steps.sync.outputs.tag }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Reprise de ${TAG:-l'original} : à regarder"
          body=$( [ -f "$RUNNER_TEMP/reason.md" ] && cat "$RUNNER_TEMP/reason.md" || echo "La compilation ou les tests ont échoué." )
          body="$body"$'\n\n'"Rien n'a été publié ; la version installée reste valable. Détail : $RUN"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          # One issue per stop: the nights after it, while it is open, add nothing.
          [ -n "$existing" ] || gh issue create --title "$title" --body "$body"
